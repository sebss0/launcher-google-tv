
name: Compilar Wave Rush APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar archivos del proyecto
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No encuentro el ZIP del proyecto."
              exit 1
            fi

            mkdir -p /tmp/wave-rush-source
            unzip -q "$ZIP_FILE" -d /tmp/wave-rush-source

            PROJECT_DIR="$(find /tmp/wave-rush-source -type f -name package.json -printf '%h\n' | head -n 1)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: El ZIP no contiene package.json."
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-rush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
