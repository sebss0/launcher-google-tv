
name: Convertir Wave Rush a APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Descomprimir proyecto
        run: |
          if [ -f "wave-rush-android-github.zip" ]; then
            unzip -o wave-rush-android-github.zip -d proyecto
            cp -a proyecto/. .
          fi

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-rush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

